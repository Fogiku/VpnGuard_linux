name: Linux release checks
on:
  pull_request:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: python3 -m unittest discover -s deploy
      - name: Verify client tuple on an isolated Linux kernel network stack
        run: |
          if ! command -v nft >/dev/null || ! command -v wg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y nftables wireguard-tools
          fi
          sudo unshare --net env VPNGUARD_PATH_NETNS=1 python3 -m unittest discover -s deploy -p test_client_path.py
          go test -c -o "$RUNNER_TEMP/vpnguard-path.test"
          sudo unshare --net sh -c 'ip link set lo up && VPNGUARD_TEST_WG_PATH=1 "$1" -test.run "^TestWireGuardClientPolicy$" -test.v' sh "$RUNNER_TEMP/vpnguard-path.test"
          sudo env VPNGUARD_TEST_PROFILE_NETNS=1 python3 -m unittest discover -s deploy -p test_compare_client_profiles.py
      - name: Verify browser egress evidence against a local HTTPS server
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-probe"
          "$RUNNER_TEMP/browser-probe/bin/pip" install 'playwright==1.62.0'
          "$RUNNER_TEMP/browser-probe/bin/playwright" install --with-deps chromium
          VPNGUARD_TEST_BROWSER=chromium "$RUNNER_TEMP/browser-probe/bin/python" -m unittest discover -s deploy -p test_browser_egress.py
